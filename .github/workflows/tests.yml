name: Tests

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  tests:
    name: Lint and test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.13"
          activate-environment: true

      - name: Install dependencies
        run: uv pip install -r requirements_test.txt

      - name: Ruff
        run: |
          ruff check
          ruff format --check

      - name: Pytest
        run: pytest
